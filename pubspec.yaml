name: paisatrack
description: "PaisaTrack — Automatic expense tracker that reads bank/UPI SMS and tells you exactly where your money went."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Backend (cloud)
  supabase_flutter: ^2.8.0

  # SMS reading (Android) — the powerful auto-parse core
  another_telephony: ^0.4.1
  permission_handler: ^11.3.1

  # Charts
  fl_chart: ^0.69.0

  # UI / fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
