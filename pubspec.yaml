name: paisatrack
description: "Spendly — Automatic expense tracker that reads bank/UPI SMS and tells you exactly where your money went. Spend smarter. Live better."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Backend (cloud)
  supabase_flutter: ^2.8.0

  # SMS reading (Android) — the powerful auto-parse core
  another_telephony: ^0.4.1
  permission_handler: ^11.3.1

  # Charts
  fl_chart: ^0.69.0

  # UI / fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2

  # Sharing (viral growth — share report cards)
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Launcher icon generated from the Spendly logo.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/spendly_icon.png"
  adaptive_icon_background: "#0E5A3E"
  adaptive_icon_foreground: "assets/branding/spendly_icon.png"
  min_sdk_android: 23

# Splash screen: the Spendly icon on the brand green.
flutter_native_splash:
  color: "#0E5A3E"
  image: assets/branding/spendly_icon.png
  android_12:
    color: "#0E5A3E"
    image: assets/branding/spendly_icon.png
