name: Build Android APK

# Builds a debug-signed release APK, uploads it as a workflow artifact, and —
# on the main branch — publishes it to a GitHub Release so there's a stable
# download link.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write # required to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Publish a "latest" release with the APK on pushes to main so there's a
      # permanent, easy download link.
      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Spendly — latest build
          body: |
            Automatic build of the Spendly APK from the latest `main`.
            Download `app-release.apk` below and install on your Android phone.
            (You may need to allow "install from unknown sources".)
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
